<div class="sign-in-bg">
  <div class="sign-in-form-container">
    <ng-container *ngIf="!signedIn; else signedInMsg">
      <form [formGroup]="signInForm" (ngSubmit)="submit()">
        <h2>Sign in to WeekendWayfinder</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" placeholder="E-mail" />
          <div *ngIf="signInForm.get('email')?.touched && signInForm.get('email')?.invalid" class="invalid">Enter a valid email.</div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Password" />
          <button type="button" class="toggle-eye" (click)="hidePassword = !hidePassword" tabindex="-1">&#128065;</button>
          <div *ngIf="signInForm.get('password')?.touched && signInForm.get('password')?.invalid" class="invalid">
            Password required (min 5 chars).
          </div>
        </div>
        <div *ngIf="formError" class="invalid">{{ formError }}</div>
        <button class="sign-in-btn" type="submit" [disabled]="signInForm.invalid">Sign In</button>
      </form>
    </ng-container>
    <ng-template #signedInMsg>
      <div style="text-align:center; font-size:1.23rem; color:var(--ww-primary, #2D5F5D);">
        Signed in
      </div>
    </ng-template>
  </div>
</div>
